<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DietAI24 Nutrition Report</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #596575;
      --line: #d6dde6;
      --accent: #146c43;
      --accent-soft: #dff4e8;
      --warm: #9a4f00;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--ink);
      margin: 0;
    }
    main {
      margin: 0 auto;
      max-width: 1480px;
      padding: 28px;
    }
    h1, h2, p { margin-top: 0; }
    h1 { font-size: 30px; margin-bottom: 8px; }
    .subhead { color: var(--muted); margin-bottom: 22px; }
    .metrics {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      margin-bottom: 18px;
    }
    .metric, .toolbar, .table-shell {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .metric { padding: 16px; }
    .metric span {
      color: var(--muted);
      display: block;
      font-size: 13px;
      margin-bottom: 7px;
    }
    .metric strong { font-size: 25px; font-weight: 650; }
    .toolbar {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 14px;
    }
    .controls {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    input[type="search"] {
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      font: inherit;
      min-width: min(360px, 72vw);
      padding: 10px 12px;
    }
    label {
      align-items: center;
      color: var(--muted);
      display: inline-flex;
      gap: 7px;
      user-select: none;
    }
    .row-count { color: var(--muted); }
    .table-shell {
      max-height: calc(100vh - 300px);
      min-height: 430px;
      overflow: auto;
    }
    table {
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px;
      min-width: 100%;
      width: max-content;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      max-width: 360px;
      padding: 10px 11px;
      text-align: left;
      vertical-align: top;
      white-space: normal;
    }
    th {
      background: #edf2f6;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    tbody tr:hover td { background: #f7fbf8; }
    td.number { font-variant-numeric: tabular-nums; text-align: right; }
    .thumb {
      background: #eef2f5;
      border: 1px solid var(--line);
      border-radius: 6px;
      display: block;
      height: 72px;
      object-fit: contain;
      width: 72px;
    }
    .empty-thumb {
      color: var(--muted);
      display: inline-block;
      min-width: 72px;
    }
    .portion {
      background: var(--accent-soft);
      border-radius: 4px;
      color: var(--accent);
      display: inline-block;
      font-weight: 600;
      padding: 3px 6px;
    }
    .warning { color: var(--warm); }
    @media (max-width: 720px) {
      main { padding: 16px; }
      h1 { font-size: 25px; }
      .table-shell { max-height: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>DietAI24 Nutrition Report</h1>
    <p class="subhead">Generated from <strong>ASA24_GPTFoodCodes_nutrition.csv</strong>. Click a header to sort. Use the full-column toggle for all FNDDS nutrient fields.</p>
    <section class="metrics">
      <div class="metric"><span>Rows</span><strong id="rowMetric"></strong></div>
      <div class="metric"><span>Average weight</span><strong id="weightMetric"></strong></div>
      <div class="metric"><span>Average energy</span><strong id="energyMetric"></strong></div>
      <div class="metric"><span>Average protein</span><strong id="proteinMetric"></strong></div>
    </section>
    <section class="toolbar">
      <div class="controls">
        <input id="search" type="search" placeholder="Search food, code, portion, nutrient...">
        <label><input id="allColumns" type="checkbox"> Show all columns</label>
      </div>
      <div class="row-count" id="rowCount"></div>
    </section>
    <section class="table-shell">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>
  </main>

    function cell(column, value) {
      if (column === "_Thumbnail") {
        return value

          : `<span class="empty-thumb">No image</span>`;

      return value

        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

      const left = a[sortColumn];
      const right = b[sortColumn];

      if (isNumber(left) && isNumber(right)) return (left - right) * sortDirection;
      return String(left).localeCompare(String(right), undefined, { numeric: true }) * sortDirection;
